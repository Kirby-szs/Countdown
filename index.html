<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>School Countdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1e3c72, #0b1020);
        font-family: Arial, sans-serif;
        color: white;
    }

    .wrap {
        text-align: center;
    }

    h1 {
        margin-bottom: 30px;
        opacity: 0.85;
    }

    /* container for digits */
    .counter {
        display: flex;
        justify-content: center;
        gap: 6px;
        font-size: 5rem;
        font-weight: 800;
    }

    /* each digit window */
    .digit {
        width: 60px;
        height: 80px;
        overflow: hidden;
        position: relative;
        background: rgba(255,255,255,0.08);
        border-radius: 10px;
    }

    /* scrolling number strip */
    .strip {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        transition: transform 0.35s ease-in-out;
    }

    .num {
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .label {
        margin-top: 20px;
        opacity: 0.7;
        font-size: 1rem;
    }
</style>
</head>

<body>

<div class="wrap">
    <h1>🎓 School Countdown</h1>

    <div class="counter" id="counter"></div>

    <div class="label">Time until June 10</div>
</div>

<script>
const endDate = new Date("2026-06-10T15:00:00");
const counter = document.getElementById("counter");

// build digit column (0–9 repeated)
function createStrip() {
    const strip = document.createElement("div");
    strip.className = "strip";

    for (let i = 0; i < 10; i++) {
        const d = document.createElement("div");
        d.className = "num";
        d.textContent = i;
        strip.appendChild(d);
    }

    return strip;
}

// create digit boxes
let digitStrips = [];

function setupDigits(length) {
    counter.innerHTML = "";
    digitStrips = [];

    for (let i = 0; i < length; i++) {
        const box = document.createElement("div");
        box.className = "digit";

        const strip = createStrip();
        box.appendChild(strip);

        counter.appendChild(box);
        digitStrips.push(strip);
    }
}

// animate digits
function setNumber(numStr) {
    // pad so it doesn't jump layout
    numStr = numStr.toString().padStart(8, "0");

    if (digitStrips.length !== numStr.length) {
        setupDigits(numStr.length);
    }

    for (let i = 0; i < numStr.length; i++) {
        const digit = parseInt(numStr[i]);
        const strip = digitStrips[i];

        strip.style.transform = `translateY(-${digit * 80}px)`;
    }
}

function update() {
    const now = new Date();
    let diff = endDate - now;

    if (diff <= 0) {
        setNumber("00000000");
        return;
    }

    const totalSeconds = Math.floor(diff / 1000);
    const days = Math.floor(totalSeconds / 86400);

    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    // compact format: DDDHHMMSS
    const display =
        String(days).padStart(3, "0") +
        String(hours).padStart(2, "0") +
        String(minutes).padStart(2, "0") +
        String(seconds).padStart(2, "0");

    setNumber(display);
}

setupDigits(8);
setInterval(update, 1000);
update();
</script>

</body>
</html>
