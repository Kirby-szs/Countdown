<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>School Countdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1e3c72, #0b1020);
        font-family: Arial, sans-serif;
        color: white;
        flex-direction: column;
    }

    h1 {
        margin-bottom: 20px;
        opacity: 0.85;
    }

    .block {
        margin: 12px 0;
        text-align: center;
    }

    .row {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        font-size: 2rem;
        font-weight: bold;
    }

    .label {
        font-size: 1rem;
        opacity: 0.7;
        margin-top: 4px;
    }

    .digit {
        width: 40px;
        height: 55px;
        overflow: hidden;
        position: relative;
        background: rgba(255,255,255,0.08);
        border-radius: 8px;
    }

    .strip {
        position: absolute;
        width: 100%;
        transition: transform 0.35s ease-in-out;
    }

    .num {
        height: 55px;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .options {
        margin-top: 25px;
        font-size: 1rem;
        opacity: 0.85;
        text-align: center;
    }

    label {
        display: block;
        margin: 6px;
        cursor: pointer;
    }

    input {
        transform: scale(1.2);
        margin-right: 8px;
    }
</style>
</head>

<body>

<h1>🎓 School Countdown</h1>

<div class="block">
    <div class="row" id="daysRow"></div>
    <div class="label">Days</div>
</div>

<div class="block">
    <div class="row" id="hoursRow"></div>
    <div class="label">Hours</div>
</div>

<div class="block">
    <div class="row" id="minutesRow"></div>
    <div class="label">Minutes</div>
</div>

<div class="block">
    <div class="row" id="secondsRow"></div>
    <div class="label">Seconds</div>
</div>

<div class="options">
    <label>
        <input type="checkbox" id="excludeWeekends">
        Exclude weekends
    </label>

    <label>
        <input type="checkbox" id="excludeJune">
        Exclude June days
    </label>
</div>

<script>
const endDate = new Date("2026-06-10T15:00:00");

function makeDigit() {
    const box = document.createElement("div");
    box.className = "digit";

    const strip = document.createElement("div");
    strip.className = "strip";

    for (let i = 0; i < 10; i++) {
        const n = document.createElement("div");
        n.className = "num";
        n.textContent = i;
        strip.appendChild(n);
    }

    box.appendChild(strip);
    return { box, strip };
}

function fillRow(row, value, size) {
    row.innerHTML = "";
    const strips = [];

    value = String(value).padStart(size, "0");

    for (let i = 0; i < size; i++) {
        const { box, strip } = makeDigit();
        row.appendChild(box);
        strips.push(strip);
    }

    for (let i = 0; i < size; i++) {
        const digit = parseInt(value[i]);
        strips[i].style.transform = `translateY(-${digit * 55}px)`;
    }

    return strips;
}

let daysStrips = [], hoursStrips = [], minutesStrips = [], secondsStrips = [];

function updateRows(days, hours, minutes, seconds) {
    daysStrips = fillRow(document.getElementById("daysRow"), days, 3);
    hoursStrips = fillRow(document.getElementById("hoursRow"), hours, 2);
    minutesStrips = fillRow(document.getElementById("minutesRow"), minutes, 2);
    secondsStrips = fillRow(document.getElementById("secondsRow"), seconds, 2);
}

function filteredDiff(now, end, noWeekends, noJune) {
    let current = new Date(now);
    let total = 0;

    while (current < end) {
        const next = new Date(current);
        next.setMinutes(current.getMinutes() + 30);

        const weekend = current.getDay() === 0 || current.getDay() === 6;
        const june = current.getMonth() === 5;

        if ((!noWeekends || !weekend) && (!noJune || !june)) {
            total += next - current;
        }

        current = next;
    }

    return total;
}

function update() {
    const now = new Date();

    const noWeekends = document.getElementById("excludeWeekends").checked;
    const noJune = document.getElementById("excludeJune").checked;

    let diff = (noWeekends || noJune)
        ? filteredDiff(now, endDate, noWeekends, noJune)
        : endDate - now;

    if (diff <= 0) {
        updateRows(0,0,0,0);
        return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    updateRows(days, hours, minutes, seconds);
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
