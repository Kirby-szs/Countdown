<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>School Countdown</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: radial-gradient(circle at top, #1e3c72, #0b1020);
        color: white;
        font-family: Arial, sans-serif;
        text-align: center;
    }

    .container {
        padding: 20px;
    }

    h1 {
        font-size: 2rem;
        margin-bottom: 20px;
        opacity: 0.9;
    }

    #countdown {
        font-size: 6vw;
        font-weight: 800;
        letter-spacing: 2px;
        margin: 20px 0;
    }

    .sub {
        font-size: 1rem;
        opacity: 0.7;
    }

    .options {
        margin-top: 25px;
        font-size: 1rem;
    }

    label {
        display: block;
        margin: 8px 0;
        cursor: pointer;
    }

    input {
        transform: scale(1.2);
        margin-right: 8px;
    }

    .done {
        font-size: 3rem;
        font-weight: bold;
        color: #00ff99;
    }
</style>
</head>

<body>

<div class="container">
    <h1>🎓 School Ends Countdown</h1>

    <div id="countdown">Loading...</div>

    <div class="sub" id="label">Time left until June 10</div>

    <div class="options">
        <label>
            <input type="checkbox" id="excludeWeekends">
            Exclude weekends
        </label>

        <label>
            <input type="checkbox" id="excludeJune">
            Exclude June days
        </label>
    </div>
</div>

<script>
const endDate = new Date("2026-06-10T15:00:00");

function filteredDiff(now, end, noWeekends, noJune) {
    let current = new Date(now);
    let total = 0;

    while (current < end) {
        const next = new Date(current);
        next.setMinutes(current.getMinutes() + 30);

        const weekend = current.getDay() === 0 || current.getDay() === 6;
        const june = current.getMonth() === 5;

        if ((!noWeekends || !weekend) && (!noJune || !june)) {
            total += next - current;
        }

        current = next;
    }

    return total;
}

function update() {
    const now = new Date();

    const noWeekends = document.getElementById("excludeWeekends").checked;
    const noJune = document.getElementById("excludeJune").checked;

    let diff = (noWeekends || noJune)
        ? filteredDiff(now, endDate, noWeekends, noJune)
        : endDate - now;

    const el = document.getElementById("countdown");

    if (diff <= 0) {
        el.innerHTML = "🎉 DONE!";
        el.classList.add("done");
        return;
    }

    const totalSeconds = Math.floor(diff / 1000);

    const days = Math.floor(totalSeconds / 86400);
    const hours = Math.floor((totalSeconds % 86400) / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    el.innerHTML = `${days}d ${hours}h ${minutes}m ${seconds}s`;
}

setInterval(update, 1000);
update();
</script>

</body>
</html>
